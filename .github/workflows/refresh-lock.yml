name: Refresh dependency lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_HTTP_USER_AGENT: dependency-lock-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Resolve the declared revisions
        run: |
          cargo update --workspace
          if [ -f fuzz/Cargo.toml ]; then cargo update --workspace --manifest-path fuzz/Cargo.toml; fi
      - run: python3 .github/check-first-party.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refreshed-lock
          path: |
            Cargo.lock
            fuzz/Cargo.lock
