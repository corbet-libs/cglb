name: ci
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: |-
        cargo update
        rustc --version > resolver.txt
        cargo --version >> resolver.txt
        date -u +%FT%TZ >> resolver.txt
        sha256sum Cargo.lock >> resolver.txt
    - uses: actions/upload-artifact@v4
      with:
        name: resolved-lock
        path: |-
          Cargo.lock
          resolver.txt
        retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - run: rustc --version
    - run: cargo fmt --all --check
    - run: node --test .github/check-pins.test.mjs
    - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
    - run: node .github/check-pins.mjs dependency-metadata.json
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - run: cargo test --locked -- --nocapture
    - run: cargo test --locked --all-features -- --nocapture
    - run: cargo test --locked --release --all-features
    - name: Prove the development gate is absent even in hardened release builds
      run: |
        mkdir -p examples
        cp .ci/development_gate_probe.rs examples/development_gate_probe.rs
        if CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true cargo check --locked --release --all-features --example development_gate_probe > release-probe.log 2>&1; then
          echo "The development gate must not compile in release builds"
          exit 1
        fi
        cat release-probe.log
        grep -F 'could not find `development` in `cglb`' release-probe.log
    - name: Review dependency licenses and pins
      run: |
        cargo metadata --locked --format-version 1 > dependency-metadata.json
        node .github/check-licenses.mjs
        node .github/check-pins.mjs dependency-metadata.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cargo-lock
        path: |
          Cargo.lock
          dependency-metadata.json
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    needs:
    - resolve
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: |-
        rustc --version
        cargo llvm-cov --version
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex '/tests/' --json --output-path coverage.json
    - name: Require complete line and branch coverage
      run: python3 .github/check-coverage.py coverage.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: |-
          coverage.json
          Cargo.lock
          resolver.txt
        retention-days: 7
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
