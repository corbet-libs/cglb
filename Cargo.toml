[package]
name = "cglb"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Global gates, uniqueness, suspension and blind passport issuance for cvld"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cglb"
readme = "README.md"
publish = false
include = ["Cargo.toml", "build.rs", "src/**", "docs/**", "README.md", "LICENSE.md"]

[features]
default = []
development-gate = []

[dependencies]
cpsd = { git = "https://github.com/corbet-foss/cpsd", rev = "0d314b97bce9aeaffb5424159e8255ce34acee1e", default-features = false, features = ["storage"] }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "80dc046d6ab53b3ea530c45bf3d7038c8b2c61b2" }
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "3ea958b522a15fecf65630aae1f9944135105497", features = ["libsql"] }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
rand = { version = "0.8", features = ["std_rng"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
