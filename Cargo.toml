[package]
name = "cglb"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Global gates, uniqueness, suspension and blind passport issuance for cvld"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cglb"
readme = "README.md"
publish = false
include = ["Cargo.toml", "build.rs", "src/**", "docs/**", "README.md", "LICENSE.md"]

[features]
default = []
development-gate = []

[dependencies]
cbcn = { git = "https://github.com/corbet-foss/cbcn", branch = "main" }
cpsd = { git = "https://github.com/corbet-foss/cpsd", branch = "main", default-features = false, features = ["storage"] }
crlt = { git = "https://github.com/corbet-foss/crlt", branch = "main" }
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", features = ["libsql"] }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
rand = { version = "0.8", features = ["std_rng"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
