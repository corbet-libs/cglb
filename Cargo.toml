[package]
name = "cglb"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Global gates, uniqueness, suspension and blind passport issuance for cvld"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cglb"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[features]
default = []
development-gate = []

[dependencies]
cpsd = { git = "https://github.com/corbet-foss/cpsd", rev = "5b2d5d9970d4beae171d85e478d06ba0b29e1992", default-features = false }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "6b94dacd7fa04aa8847c62c6471a1fc5c0f6c9dc" }
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "d7203f310c3c129c3f67ef4ef3e34ccf0ae8c93b", features = ["libsql"] }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
rand = { version = "0.8", features = ["std_rng"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
